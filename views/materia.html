<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matéria - Vest+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/dashboard.css">
    <link rel="icon" type="image/svg+xml" href="../public/img/logo1.svg">
</head>

<body>
    <header class="dashboard-header">
        <div class="logo"><img src="../public/img/logo1.svg" alt="" class="logo-img">Vest<span>+</span></div>
        <a class="link-voltar" href="dashboard.html">← Voltar ao painel</a>
    </header>
    <main class="materia-pagina">
        <div class="dashboard-titulo">
            <h1 id="materia-nome"></h1>
            <p id="materia-area"></p>
            <div class="materia-progresso">
                <p id="materia-progresso-texto" class="materia-progresso-texto"></p>
                <div class="barra">
                    <div id="materia-progresso-barra" class="barra-preenchimento"></div>
                </div>
            </div>
        </div>

        <section id="gerais-secao" hidden>
            <p class="secao-titulo">Para começar</p>
            <div id="gerais-container" class="subtopico-links"></div>
        </section>

        <section>
            <p class="secao-titulo">Subtópicos</p>
            <div id="subtopicos-container">
                <!-- blocos de subtópico inseridos aqui pelo JS -->
            </div>
        </section>
    </main>
    <script src="../public/js/auth.js"></script>
    <script src="../public/js/dados-dashboard.js"></script>
    <script src="../public/js/progresso.js"></script>
    <script src="../public/js/materia.js"></script>
</body>

</html>
