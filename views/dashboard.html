<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Vest+</title>
    <link rel="stylesheet" href="../public/css/dashboard.css">
</head>

<body>
    <header class="dashboard-header">
        <div class="logo">Vest<span>+</span></div>       
        <div class="usuario-info">
            <span id="nome-usuario"></span>
            <span id="avatar-usuario" class="avatar-inicial"></span>
        </div>
    </header>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <p class="sidebar-titulo">Áreas</p>
            <nav id="lista-areas" class="sidebar-lista">
                <!-- botões de área inseridos aqui pelo JS -->
            </nav>
        </aside>
        <main class="conteudo-principal">          
            <section class="feitos">
               <p class="secao-titulo">Feitos</p>
               <div id="feitos-container" class="feitos-grid">
                   <!-- matérias marcadas como vistas inseridas aqui pelo JS -->
               </div>
            </section>
            <section class="destaques">
                <p class="secao-titulo">Em destaque</p>
                <div id="destaques-container" class="destaques-grid">
                    <!-- os 2 cards de destaque inseridos aqui pelo JS -->
                </div>
            </section>
            <section class="materias">
                <p class="secao-titulo">Matérias</p>
                <div id="materias-container" class="materias-grid">
                    <!-- cards de matéria inseridos aqui pelo JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="../public/js/dados-dashboard.js"></script>
    <script src="../public/js/dashboard.js"></script>
</body>

</html>
