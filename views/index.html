<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vest+</title>
</head>
<body>
    <main class="login-container">

        <!-- Área institucional -->
        <section class="login-info">
            <div class="logo">
                <span>Vest+</span>
            </div>

            <h1>Bem-vindo ao Vest+</h1>
            <p>Sua preparação para o vestibular começa aqui.</p>
        </section>

        <!-- Área do formulário -->
        <section class="login-form">
            <h2>Entrar</h2>
            <p>Preencha seus dados para acessar sua conta.</p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Digite seu e-mail" 
                        autocomplete="email" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        placeholder="Digite sua senha" 
                        autocomplete="current-password" 
                        required
                    >
                </div>

                <div class="form-options">
                    <label for="lembrar">
                        <input type="checkbox" id="lembrar" name="lembrar">
                        Lembrar de mim
                    </label>

                    <a href="#">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>

                <p class="signup-text">
                    Ainda não tem conta?
                    <a href="#">Criar conta</a>
                </p>
            </form>
        </section>

    </main>
</body>
</html>
