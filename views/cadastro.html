<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/cadastro.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro - Vest+</title>
</head>
<body>
    <div class="register-container">
        <h1>Crie sua conta</h1>
        <form action="#" method="post">
            <label for="nome">Nome completo</label><br />
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required /><br /><br />

            <label for="email">E-mail</label><br />
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required /><br /><br />

            <label for="telefone">Telefone</label><br />
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" /><br /><br />

            <label for="senha">Senha</label><br />
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required /><br /><br />

            <label for="confirmar-senha">Confirmar senha</label><br />
            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha" required /><br /><br />

            <button type="submit">Cadastrar</button>
        </form>
        <p>
            Já tem uma conta? <a href="login.html">Entrar</a>
        </p>
    </div>
</body>
</html>
